<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图提取 · 图片画廊</title>
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <!-- ===================== 顶部工具栏 ===================== -->
  <header class="ig-header">
    <div class="ig-header-inner">
      <!-- 品牌区 -->
      <div class="ig-brand">
        <svg class="ig-logo" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <defs>
            <linearGradient id="igg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4f7cff"/>
              <stop offset="1" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#igg)"/>
          <path fill="#fff" d="M12 6a1 1 0 0 1 1 1v5.17l1.79-1.79a1 1 0 1 1 1.42 1.42l-3.5 3.5a1 1 0 0 1-1.42 0l-3.5-3.5a1 1 0 1 1 1.42-1.42L11 12.17V7a1 1 0 0 1 1-1zM8 17.5h8a.9.9 0 1 1 0 1.8H8a.9.9 0 1 1 0-1.8z"/>
        </svg>
        <div class="ig-brand-text">
          <strong>图片画廊</strong>
          <span id="pageSource" title="">提取自当前商品页</span>
        </div>
      </div>

      <!-- 操作区 -->
      <div class="ig-actions">
        <button id="btnSelectAll" class="ig-btn" type="button">全选</button>
        <button id="btnInvert" class="ig-btn" type="button">反选</button>
        <span id="selCount" class="ig-sel-count">已选 0 张</span>
        <button id="btnDownload" class="ig-btn ig-btn-primary" type="button">下载选中</button>
      </div>
    </div>

    <!-- 下载进度条（下载时显示） -->
    <div id="progressWrap" class="ig-progress-wrap" hidden>
      <div class="ig-progress-info">
        <span id="progressText">准备下载…</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="ig-progress-track">
        <div id="progressBar" class="ig-progress-bar"></div>
      </div>
    </div>
  </header>

  <!-- ===================== 图片网格 ===================== -->
  <main class="ig-main">
    <div id="grid" class="ig-grid"><!-- 由 gallery.js 动态渲染 --></div>

    <!-- 空状态 -->
    <div id="emptyState" class="ig-empty" hidden>
      <svg viewBox="0 0 24 24" width="56" height="56" aria-hidden="true">
        <path fill="#c7d2fe" d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v9.6l4.2-4.2a1.4 1.4 0 0 1 2 0L14 15l2-2a1.4 1.4 0 0 1 2 0l4 4V6H4zm3.6 1.4a1.9 1.9 0 1 1 0 3.8 1.9 1.9 0 0 1 0-3.8z"/>
      </svg>
      <p>暂无图片数据</p>
      <p class="ig-empty-sub">请先在淘宝 / 京东 / 拼多多商家版的商品详情页点击右下角「获取图片」按钮</p>
    </div>
  </main>

  <!-- ===================== 结果反馈 Toast ===================== -->
  <div id="toast" class="ig-toast" role="status"></div>

  <script src="gallery.js" defer></script>
</body>
</html>
